version: '3.8'

services:
  # PostgreSQL database for project persistence
  postgres:
    image: postgres:16-alpine
    container_name: emergent-postgres
    environment:
      POSTGRES_DB: emergent
      POSTGRES_USER: emergent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-emergent_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emergent -d emergent"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - emergent-network

  # Redis for caching and task queue
  redis:
    image: redis:7-alpine
    container_name: emergent-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - emergent-network

  # Backend API server (FastAPI)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: emergent-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://emergent:emergent_dev@postgres:5432/emergent
      REDIS_URL: redis://redis:6379/0
      NIM_API_KEY: ${NIM_API_KEY}
      NIM_BASE_URL: ${NIM_BASE_URL:-https://integrate.api.nvidia.com/v1}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-in-production}
      DEBUG: ${DEBUG:-true}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - emergent-network
    command: >
      sh -c "cd /app && uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload"

  # Frontend development server (React/Next.js)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: emergent-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    depends_on:
      - backend
    networks:
      - emergent-network
    command: >
      sh -c "cd /app/frontend && npm install && npm run dev"

  # Live preview server for generated apps
  preview:
    build:
      context: .
      dockerfile: Dockerfile.preview
    container_name: emergent-preview
    environment:
      PREVIEW_PORT: 3001
    ports:
      - "3001:3001"
    volumes:
      - ./preview_apps:/app/preview_apps
      - ./src/core/preview:/app/src/core/preview
    networks:
      - emergent-network

volumes:
  postgres_data:
  redis_data:

networks:
  emergent-network:
    driver: bridge
